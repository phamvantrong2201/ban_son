 <head>

            primary: '#dc2626',

            muted: '#6b7280'

 </head>
 <body class="h-full overflow-auto" style="background-color: #f9fafb;">
  <div id="app" class="w-full h-full">
   <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

       <img src="https://scontent.fdad1-4.fna.fbcdn.net/v/t39.30808-6/668700396_122096204090738647_955017850661954942_n.jpg?_nc_cat=103&ccb=1-7&_nc_sid=1d70fc&_nc_eui2=AeFbWtMM1yS3_efS__Ba9i-Y57AuJbupOvPnsC4lu6k68-qK22CTUsZBtvE_KMS40SHB7PsrZpLyzY1JsKiSa-76&_nc_ohc=_zaUrz8ZUOIQ7kNvwHP2G5B&_nc_oc=AdozfP6Vni7yorrETrNsvtLGSSh0G_u4BFtuVDZGRx63_0fXdOXW9GMJ_dA1hEgL94Q&_nc_zt=23&_nc_ht=scontent.fdad1-4.fna&_nc_gid=9mwWZjsv4RKrUREfFJs-EA&_nc_ss=7b2a8&oh=00_Af6weVA-So7-B4Py3q_z6b48IFmoEAQMrkfjtB4rxgOxxA&oe=69FBE2B6" alt="Logo" class="w-full h-full object-cover">
      </div>
      <h1 id="store-name" class="text-xl md:text-2xl font-bold text-dark">Sơn Nước Thiện Phát</h1>
     </div>     <div class="flex items-center gap-4">
      <div class="hidden md:flex relative">
       <input type="text" id="search-input" placeholder="Tìm sản phẩm..." class="pl-9 pr-4 py-2 border border-gray-200 rounded-full text-sm focus:outline-none focus:border-primary w-48"> <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-muted"></i>
      </div><button id="cart-btn" class="relative p-2 hover:bg-gray-100 rounded-lg transition"> <i data-lucide="shopping-cart" class="w-6 h-6"></i> <span id="cart-count" class="absolute -top-1 -right-1 bg-primary text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span> </button>
     </div>

   </header>
   <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex flex-col md:flex-row gap-4 mb-8 items-start md:items-center">
     <div class="flex gap-2 flex-wrap"><button class="category-filter px-4 py-2 rounded-full bg-primary text-white text-sm font-medium cursor-pointer" data-category="all">Tất cả</button> <button class="category-filter px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm font-medium cursor-pointer hover:bg-gray-300 transition" data-category="noi-that">Nội thất</button> <button class="category-filter px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm font-medium cursor-pointer hover:bg-gray-300 transition" data-category="ngoai-that">Ngoại thất</button> <button class="category-filter px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm font-medium cursor-pointer hover:bg-gray-300 transition" data-category="chong-tham">Chống thấm</button> <button class="category-filter px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm font-medium cursor-pointer hover:bg-gray-300 transition" data-category="son-lot">Sơn Lót</button> <button class="category-filter px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm font-medium cursor-pointer hover:bg-gray-300 transition" data-category="son-dau">Sơn dầu</button> <button class="category-filter px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm font-medium cursor-pointer hover:bg-gray-300 transition" data-category="son-kem">Sơn kẽm</button> <button class="category-filter px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm font-medium cursor-pointer hover:bg-gray-300 transition" data-category="chong-o">Chống ố</button> <button class="category-filter px-4 py-2 rounded-full bg-gray-200 text-gray-700 text-sm font-medium cursor-pointer hover:bg-gray-300 transition" data-category="khac">Khác</button>
     </div>
     <div class="ml-auto flex items-center gap-2"><span class="text-sm text-muted">Sắp xếp:</span> <select id="sort-select" class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-primary"> <option value="newest">Mới nhất</option> <option value="price-low">Giá: Thấp → Cao</option> <option value="price-high">Giá: Cao → Thấp</option> </select>
     </div>
    </div>
    <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
     <div class="col-span-full text-center py-12 text-gray-400"><i data-lucide="package" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
      <p>Đang tải sản phẩm...</p>
     </div>
    </div>
    <div class="text-center"><button id="load-more-btn" class="px-8 py-3 bg-white border-2 border-primary text-primary rounded-full font-semibold hover:bg-primary hover:text-white transition" style="display:none;">Xem thêm sản phẩm</button>
    </div>
   </main>
   <div id="cart-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end md:items-center md:justify-end">
    <div class="bg-white w-full md:w-96 h-3/4 md:h-auto md:max-h-96 rounded-t-2xl md:rounded-2xl md:mr-4 flex flex-col">
     <div class="flex items-center justify-between p-4 border-b">
      <h2 class="text-lg font-bold">Giỏ hàng</h2><button id="close-cart-btn" class="p-2 hover:bg-gray-100 rounded-lg transition"><i data-lucide="x" class="w-5 h-5"></i></button>
     </div>
     <div id="cart-items" class="flex-1 overflow-y-auto p-4">
      <p class="text-center text-gray-400 py-8">Giỏ hàng trống</p>
     </div>
     <div class="border-t p-4">
      <div class="flex justify-between items-center mb-4"><span class="font-semibold">Tổng cộng:</span> <span id="cart-total" class="text-2xl font-bold text-primary">0đ</span>
      </div><button id="checkout-btn" class="w-full py-3 bg-primary text-white rounded-lg font-semibold hover:bg-red-700 transition">Thanh toán</button>
     </div>
    </div>
   </div>
   <div id="success-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-8 max-w-sm text-center">
     <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4"><i data-lucide="check" class="w-8 h-8 text-green-600"></i>
     </div>
     <h3 class="text-xl font-bold mb-2">Đặt hàng thành công!</h3>
     <p class="text-gray-600 mb-6">Cảm ơn bạn đã tin tưởng chúng tôi.</p><button id="close-success-btn" class="px-6 py-2 bg-primary text-white rounded-full font-semibold hover:bg-red-700 transition">Tiếp tục mua sắm</button>
    </div>
   </div>
   <div id="checkout-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md flex flex-col max-h-[90vh]">
     <div class="flex items-center justify-between p-4 border-b">
      <h2 class="text-lg font-bold">Thông tin giao hàng</h2><button id="close-checkout-btn" class="p-2 hover:bg-gray-100 rounded-lg transition"><i data-lucide="x" class="w-5 h-5"></i></button>
     </div>
     <div class="p-4 overflow-y-auto">
      <form id="checkout-form" class="flex flex-col gap-4">
       <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Họ và tên *</label>
        <input type="text" id="customer-name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary">
       </div>
       <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại *</label>
        <input type="tel" id="customer-phone" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary">
       </div>
       <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Địa chỉ giao hàng *</label>
        <textarea id="customer-address" required rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary"></textarea>
       </div>
       <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
        <textarea id="customer-note" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary"></textarea>
       </div>
      </form>
     </div>
     <div class="border-t p-4 flex gap-3">
      <button id="cancel-checkout-btn" class="flex-1 py-3 bg-gray-100 text-gray-700 rounded-lg font-semibold hover:bg-gray-200 transition">Hủy</button>
      <button id="submit-order-btn" class="flex-1 py-3 bg-primary text-white rounded-lg font-semibold hover:bg-red-700 transition flex items-center justify-center gap-2">
       <span>Đặt hàng</span>
       <i data-lucide="loader-2" class="w-4 h-4 animate-spin hidden" id="submit-loader"></i>
      </button>
     </div>
    </div>
   </div>
  </div>
  <script>
   window.dataSdk = {
    init: async function(handler) { this.handler = handler; },
    create: async function(prod) { 
     prod.__backendId = Date.now().toString() + Math.random().toString();
     products.push(prod);
     if(this.handler) this.handler.onDataChanged(products);
     return { isOk: true };
    },
    update: async function(prod) {
     const idx = products.findIndex(p => p.__backendId === prod.__backendId);
     if(idx >= 0) products[idx] = prod;
     if(this.handler) this.handler.onDataChanged(products);
     return { isOk: true };
    }
   };
   
   window.elementSdk = {
    init: function(config) { if(config.onConfigChange) config.onConfigChange(config.defaultConfig); },
    setConfig: function(c) {}
   };

   const defaultConfig = {
    store_name: 'Sơn Nước Thiện Phát',
    store_tagline: 'Sản phẩm chất lượng, giá cả hợp lý',
    promo_text: '🎉 Mua 3 tặng 1 cho tất cả sản phẩm!',
    background_color: '#f9fafb',
    surface_color: '#ffffff',
    text_color: '#1a1a2e',
    primary_color: '#dc2626',
    accent_color: '#f59e0b',
    font_family: 'Poppins',
    font_size: 16
   };

   let currentConfig = {...defaultConfig};
   let products = [];
   let cart = [];
   let filteredProducts = [];
   let displayedCount = 8;
   let selectedCategory = 'all';

   const dataHandler = {
    onDataChanged(data) {
     products = data || [];
     applyFilters();
     renderProducts();
    }
   };

   async function initSDKs() {
    await window.dataSdk.init(dataHandler);

    window.elementSdk.init({
     defaultConfig,
     onConfigChange: async (config) => { 
      currentConfig = config;
      applyConfig(config); 
     },
     mapToCapabilities: (config) => ({
      recolorables: [],
      borderables: [],
      fontEditable: {},
      fontSizeable: {}
     }),
     mapToEditPanelValues: (config) => new Map()
    });

    applyConfig(currentConfig);
   }

   function applyConfig(config) {
    document.getElementById('store-name').textContent = config.store_name || defaultConfig.store_name;
    //document.getElementById('promo-text').textContent = config.promo_text || defaultConfig.promo_text;

    const bg = config.background_color || defaultConfig.background_color;
    const text = config.text_color || defaultConfig.text_color;
    const primary = config.primary_color || defaultConfig.primary_color;
    const accent = config.accent_color || defaultConfig.accent_color;
    const font = config.font_family || defaultConfig.font_family;
    const size = config.font_size || defaultConfig.font_size;

    document.body.style.backgroundColor = bg;
    document.body.style.color = text;
    document.body.style.fontFamily = `${font}, sans-serif`;
    document.body.style.fontSize = `${size}px`;

    const style = document.getElementById('dynamic-style') || document.createElement('style');
    style.id = 'dynamic-style';
    style.textContent = `
     .bg-primary, .hover\\:bg-primary:hover { background-color: ${primary} !important; }
     .text-primary, .hover\\:text-primary:hover, .group-hover\\:text-primary { color: ${primary} !important; }
     .border-primary { border-color: ${primary} !important; }
     .text-accent { color: ${accent} !important; }
     .category-filter.active { background-color: ${primary} !important; color: white !important; }
     ::-webkit-scrollbar-thumb { background-color: ${primary}; }
    `;
    if (!document.getElementById('dynamic-style')) document.head.appendChild(style);
   }

   function applyFilters() {
    filteredProducts = selectedCategory === 'all' 
     ? [...products]
     : products.filter(p => p.category === selectedCategory);

    const sortValue = document.getElementById('sort-select').value;
    if (sortValue === 'price-low') filteredProducts.sort((a, b) => a.price - b.price);
    else if (sortValue === 'price-high') filteredProducts.sort((a, b) => b.price - a.price);
    else filteredProducts.reverse();

    displayedCount = 8;
   }

   function renderProducts() {
    const container = document.getElementById('products-container');
    const display = filteredProducts.slice(0, displayedCount);
    
    const categoryNames = {
     'noi-that': 'Nội thất',
     'ngoai-that': 'Ngoại thất',
     'chong-tham': 'Chống thấm',
     'son-lot': 'Sơn Lót',
     'son-dau': 'Sơn dầu',
     'son-kem': 'Sơn kẽm',
     'chong-o': 'Chống ố',
     'khac': 'Khác'
    };
    
    if (display.length === 0) {
     container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400"><i data-lucide="package" class="w-12 h-12 mx-auto mb-3 opacity-50"></i><p>Không có sản phẩm</p></div>';
    } else {
     container.innerHTML = display.map(p => `
      <div class="product-card bg-white rounded-lg overflow-hidden shadow-sm hover:shadow-lg">
       <div class="aspect-square bg-gradient-to-br from-gray-200 to-gray-300 flex items-center justify-center overflow-hidden">
        ${p.image ? '<img src="' + p.image + '" alt="' + p.product_name + '" class="w-full h-full object-cover" />' : '<i data-lucide="image" class="w-12 h-12 text-gray-400"></i>'}
       </div>
       <div class="p-4">
        <p class="text-xs text-accent font-semibold uppercase">${categoryNames[p.category] || p.category}</p>
        <h3 class="font-semibold text-sm mt-1 line-clamp-2">${p.product_name}</h3>
        <div class="flex items-center justify-between mt-3">
         <span class="text-lg font-bold text-primary">${p.price.toLocaleString()}đ</span>
         <span class="text-xs bg-gray-100 px-2 py-1 rounded">Còn: ${p.stock}</span>
        </div>
        <button onclick="addToCart('${p.__backendId}', '${p.product_name}', ${p.price})" class="w-full mt-3 py-2 bg-primary text-white text-sm font-semibold rounded-lg hover:opacity-90 transition">Thêm vào giỏ</button>
       </div>
      </div>
     `).join('');
     lucide.createIcons();
    }

    document.getElementById('load-more-btn').style.display = displayedCount < filteredProducts.length ? 'block' : 'none';
   }

   function addToCart(id, name, price) {
    const product = products.find(p => p.__backendId === id);
    const stock = product ? product.stock : 0;
    const existing = cart.find(item => item.id === id);
    if (existing) {
     if (existing.qty + 1 > stock) {
      alert('Sản phẩm này không đủ số lượng trong kho!');
      return;
     }
     existing.qty += 1;
    } else {
     if (1 > stock) {
      alert('Sản phẩm này không đủ số lượng trong kho!');
      return;
     }
     cart.push({ id, name, price, qty: 1 });
    }
    updateCart();
   }

   function updateCart() {
    document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.qty, 0);
    
    const itemsContainer = document.getElementById('cart-items');
    if (cart.length === 0) {
     itemsContainer.innerHTML = '<p class="text-center text-gray-400 py-8">Giỏ hàng trống</p>';
    } else {
     itemsContainer.innerHTML = cart.map(item => `
      <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg mb-2">
       <div class="flex-1">
        <p class="font-medium text-sm">${item.name}</p>
        <p class="text-xs text-gray-500">${item.price.toLocaleString()}đ</p>
       </div>
       <div class="flex items-center gap-2">
        <button onclick="updateQty('${item.id}', -1)" class="p-1 hover:bg-gray-200 rounded text-xs">-</button>
        <span class="w-6 text-center text-sm font-semibold">${item.qty}</span>
        <button onclick="updateQty('${item.id}', 1)" class="p-1 hover:bg-gray-200 rounded text-xs">+</button>
        <button onclick="removeFromCart('${item.id}')" class="p-1 hover:bg-red-100 rounded text-xs ml-2"><i data-lucide="trash-2" class="w-3 h-3 text-red-600"></i></button>
       </div>
      </div>
     `).join('');
    }

    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    document.getElementById('cart-total').textContent = total.toLocaleString() + 'đ';
    lucide.createIcons();
   }

   function updateQty(id, change) {
    const item = cart.find(i => i.id === id);
    if (item) {
     item.qty += change;
     if (item.qty <= 0) removeFromCart(id);
     else updateCart();
    }
   }

   function removeFromCart(id) {
    cart = cart.filter(i => i.id !== id);
    updateCart();
   }

   document.getElementById('cart-btn').addEventListener('click', () => {
    document.getElementById('cart-modal').classList.remove('hidden');
   });

   document.getElementById('close-cart-btn').addEventListener('click', () => {
    document.getElementById('cart-modal').classList.add('hidden');
   });

   document.getElementById('checkout-btn').addEventListener('click', () => {
    if (cart.length === 0) return;
    document.getElementById('cart-modal').classList.add('hidden');
    document.getElementById('checkout-modal').classList.remove('hidden');
    lucide.createIcons();
   });

   document.getElementById('close-checkout-btn').addEventListener('click', () => {
    document.getElementById('checkout-modal').classList.add('hidden');
   });

   document.getElementById('cancel-checkout-btn').addEventListener('click', () => {
    document.getElementById('checkout-modal').classList.add('hidden');
   });

   document.getElementById('submit-order-btn').addEventListener('click', async () => {
    const name = document.getElementById('customer-name').value.trim();
    const phone = document.getElementById('customer-phone').value.trim();
    const address = document.getElementById('customer-address').value.trim();
    const note = document.getElementById('customer-note').value.trim();

    if (!name || !phone || !address) {
     alert('Vui lòng điền đầy đủ các thông tin bắt buộc (Họ và tên, Số điện thoại, Địa chỉ).');
     return;
    }

    const submitBtn = document.getElementById('submit-order-btn');
    const loader = document.getElementById('submit-loader');
    submitBtn.disabled = true;
    loader.classList.remove('hidden');

    try {
     // Kiểm tra lại tồn kho trước khi đặt hàng
     for (let item of cart) {
      const product = products.find(p => p.__backendId === item.id);
      if (product && item.qty > product.stock) {
       alert(`Sản phẩm "${item.name}" hiện không đủ số lượng trong kho!`);
       submitBtn.disabled = false;
       loader.classList.add('hidden');
       return;
      }
     }

     const orderItems = cart.map(item => `${item.name} (x${item.qty})`).join(', ');
     const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

     // Tạo thời gian định dạng dd-mm-yyyy hh-mm-ss (UTC+7)
     const now = new Date();
     const utc7Date = new Date(now.getTime() + (7 * 60 * 60 * 1000));
     const day = String(utc7Date.getUTCDate()).padStart(2, '0');
     const month = String(utc7Date.getUTCMonth() + 1).padStart(2, '0');
     const year = utc7Date.getUTCFullYear();
     const hours = String(utc7Date.getUTCHours()).padStart(2, '0');
     const minutes = String(utc7Date.getUTCMinutes()).padStart(2, '0');
     const seconds = String(utc7Date.getUTCSeconds()).padStart(2, '0');
     const timestamp = `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;

     const orderData = {
      name,
      phone,
      address,
      note,
      items: orderItems,
      total,
      timestamp: timestamp,
      cartDetails: cart
     };

     // URL của Google Apps Script Web App để nhận dữ liệu
     // Bạn cần tạo 1 Google Apps Script (Web App) và dán URL vào biến này để lưu dữ liệu vào Google Sheet
     const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLt1eVideHQGOnWSPCB1lIJcdaXy-Ie7fwkbOAJUnm8mZ0F4n4Q-m6UU7EeFen8PIK/exec';
     
     if (GOOGLE_SCRIPT_URL !== 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
      await fetch(GOOGLE_SCRIPT_URL, {
       method: 'POST',
       mode: 'no-cors',
       headers: {
        'Content-Type': 'application/json'
       },
       body: JSON.stringify(orderData)
      });
     } else {
      console.warn('Vui lòng cấu hình GOOGLE_SCRIPT_URL để lưu dữ liệu vào Google Sheet.');
      console.log('Dữ liệu đơn hàng:', orderData);
     }

     for (let item of cart) {
      const product = products.find(p => p.__backendId === item.id);
      if (product) {
       await window.dataSdk.update({...product, stock: product.stock - item.qty});
      }
     }

     cart = [];
     updateCart();
     document.getElementById('checkout-form').reset();
     document.getElementById('checkout-modal').classList.add('hidden');
     document.getElementById('success-modal').classList.remove('hidden');
    } catch (error) {
     console.error('Lỗi khi đặt hàng:', error);
     alert('Có lỗi xảy ra khi đặt hàng. Vui lòng thử lại!');
    } finally {
     submitBtn.disabled = false;
     loader.classList.add('hidden');
    }
   });

   document.getElementById('close-success-btn').addEventListener('click', () => {
    document.getElementById('success-modal').classList.add('hidden');
   });

   document.querySelectorAll('.category-filter').forEach(btn => {
    btn.addEventListener('click', () => {
     document.querySelectorAll('.category-filter').forEach(b => {
      b.classList.remove('active', 'bg-primary', 'text-white');
      b.classList.add('bg-gray-200', 'text-gray-700');
     });
     btn.classList.add('active', 'bg-primary', 'text-white');
     btn.classList.remove('bg-gray-200', 'text-gray-700');
     selectedCategory = btn.dataset.category;
     applyFilters();
     renderProducts();
    });
   });

   document.getElementById('sort-select').addEventListener('change', () => {
    applyFilters();
    renderProducts();
   });

   document.getElementById('load-more-btn').addEventListener('click', () => {
    displayedCount += 8;
    renderProducts();
   });

   document.getElementById('search-input').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    filteredProducts = products.filter(p => p.product_name.toLowerCase().includes(query));
    displayedCount = 8;
    renderProducts();
   });

   async function loadProductsFromSheet() {
    // 1. DÁN ID CỦA FILE "Ban_son" VÀO ĐÂY:
    const SPREADSHEET_ID = '1ddq_2L4yNQti6-MZuN8mhrYtKFdQTBGP6NX0VAhxr4M'; 
    
    // 2. Đã thêm &headers=1 vào cuối URL để tránh lỗi không nhận diện được tiêu đề
    const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&headers=1`;
    
    try {
     const response = await fetch(url);
     const text = await response.text();
     const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
     if (!jsonMatch) {
       console.log('Không thể đọc dữ liệu.');
       return;
     }
     const data = JSON.parse(jsonMatch[1]);
     
     const headers = data.table.cols.map(col => col.label);
     const rows = data.table.rows.map(row => {
      const rowData = {};
      row.c.forEach((cell, i) => {
       rowData[headers[i]] = cell ? cell.v : null;
      });
      return rowData;
     });

     for (let row of rows) {
      if (!row.product_name) continue; // Bỏ qua dòng trống
      const prod = {
       product_name: row.product_name,
       price: Number(row.price) || 0,
       category: row.category || 'khac',
       stock: Number(row.stock) || 0,
       image: row.image || ''
      };
      const result = await window.dataSdk.create(prod);
      if (!result.isOk) console.error('Lỗi:', result.error);
     }
    } catch (error) {
     console.error('Lỗi tải dữ liệu từ Google Sheets:', error);
    }
   }

   let checkSampleData = false;
   setTimeout(async () => {
    if (products.length === 0 && !checkSampleData) {
     checkSampleData = true;
     await loadProductsFromSheet();
    }
   }, 1000);

   initSDKs();
   lucide.createIcons();
  </script>
